name: Sync bundle versions

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync versions from GitHub Releases
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-versions.js

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync bundle versions from GitHub Releases"
          branch: sync-bundle-versions
          delete-branch: true
          title: "chore: sync bundle versions from GitHub Releases"
          body: |
            Mise à jour automatique de `registry.json` : les `versions` de chaque
            bundle ont été resynchronisées avec les releases GitHub taguées
            (`vX.Y.Z`) de leur dépôt respectif.

            Généré par le workflow `sync-versions`.
          labels: automated
