name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate registry.json
        run: node scripts/validate-registry.js

      - name: Unit tests (commit pinning)
        run: node --test scripts/*.test.js
